[package]
name = "m-agenda"
version = "0.2.0"
edition = "2021"
authors = ["Marlo"]
description = "Planificador Semanal Vectorial con LOD dinámico y exportación 16:9 pura"

[dependencies]
egui = "0.37"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
printpdf = { version = "0.13", default-features = false }
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
